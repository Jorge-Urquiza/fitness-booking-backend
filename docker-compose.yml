services:
  mysql:
    image: mysql:8
    container_name: fitness-booking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: fitness_booking
      MYSQL_USER: fitness_user
      MYSQL_PASSWORD: fitness_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
